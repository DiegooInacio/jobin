name: jobin

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobin_local}
      POSTGRES_DB: ${POSTGRES_DB:-jobin}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  db-test:
    image: postgres:16-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: jobin
      POSTGRES_PASSWORD: jobin_test_local
      POSTGRES_DB: jobin_test
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5434}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  postgres_data:
